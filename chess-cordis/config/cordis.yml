# cordis.yml — declarative engine manifest for the Cordis chess harness.
#
# Consumed by src/loader.mjs (applyManifest). This is the Cordis Loader
# plugin-config shape: a top-level `plugins:` map keyed by engine id, each entry
# enabling/disabling a component and supplying its options.
#
# SPATIAL composability: the set of engines that compose is DATA, not code.
#   * Adding a NEW subprocess engine = append one entry here. No code change.
#   * Disabling an engine at runtime = set `enabled: false` (or call
#     chessRegistry.loaderApi.disable(id)); the loader disposes its fiber
#     (deregisters + kills the child process) — TEMPORAL composability.
#
# Architecture boundary (post re-alignment):
#   * chess-cordis CONSUMES the real `cordis` + `@cordisjs/plugin-loader`
#     packages (no vendored copy).
#   * Each language engine (*Chess) stays ZERO-DEPENDENCY and
#     cordis-UNAWARE. No JSON-stdio / cordis glue lives inside an engine dir.
#   * The JSON-stdio glue lives in chess-cordis/drivers/<lang>/ as a HARNESS
#     adapter: js is imported in-process (src/ports/js.mjs); every other enabled
#     engine is a subprocess spawned by src/ports/subprocess.mjs, tracked by a
#     ctx.effect that kills the child on teardown.
#
# Build artifacts referenced below:
#   drivers/csharp/  -> ChessEngineDriver.dll  (dotnet build, net8.0)
#   drivers/fsharp/  -> FSharpChessDriver.dll (dotnet build, net8.0)
#   drivers/java/    -> out/ (javac of Driver.java + JavaChess core)
#   drivers/vb/      -> VBChessDriver.exe     (vbc, .NET Framework 4.x)
#   drivers/py/      -> py_engine_driver.py    (sys.path injects PyChess)
#   drivers/ts/      -> out/driver.cjs         (esbuild bundle of TsChess core)
#   drivers/go/      -> gochess_driver.exe    (go build of chess_core/chess_ai + driver)
#   drivers/rust/    -> target/release/rustchess_driver.exe (cargo build --release)
#   drivers/cpp/     -> cppchess_driver.exe    (g++.exe -static, links chess_core/chess_ai)
#
# cpp / go / rust are ENABLED: toolchain located on this machine
#   (go, cargo/rustc（PATH）/{cargo,rustc}.exe,
#    g++). Their harness drivers were built and
#   validated against the golden perft values.

plugins:
  js:
    kind: native
    enabled: true
    language: JavaScript

  ts:
    kind: subprocess
    enabled: true
    language: TypeScript
    # Kiwipete d4 (4.08M nodes) takes ~14s in-process-equivalent; raise past the
    # 15s default so the timing harness can measure it instead of timing out.
    timeout: 120000
    cmd: node
    args:
      - chess-cordis/drivers/ts/out/driver.cjs

  py:
    kind: subprocess
    enabled: true
    language: Python
    # Python perft is the slowest by a wide margin (~82s on Kiwipete d4); raise
    # the timeout well above that so the timing harness can measure it.
    timeout: 120000
    cmd: python
    args:
      - chess-cordis/drivers/py_engine_driver.py

  cs:
    kind: subprocess
    enabled: true
    language: C#
    cmd: dotnet
    args:
      - chess-cordis/drivers/csharp/bin/Release/net8.0/ChessEngineDriver.dll

  fsharp:
    kind: subprocess
    enabled: true
    language: F#
    cmd: dotnet
    args:
      - chess-cordis/drivers/fsharp/bin/Release/net8.0/FSharpChessDriver.dll

  java:
    kind: subprocess
    enabled: true
    language: Java
    cmd: java
    args:
      - -cp
      - chess-cordis/drivers/java/out
      - Driver

  vb:
    kind: subprocess
    enabled: true
    language: VB.NET
    cmd: chess-cordis/drivers/vb/VBChessDriver.exe
    args: []

  cpp:
    kind: subprocess
    enabled: true
    language: C++
    cmd: chess-cordis/drivers/cpp/cppchess_driver.exe
    args: []

  go:
    kind: subprocess
    enabled: true
    language: Go
    cmd: chess-cordis/drivers/go/gochess_driver.exe
    args: []

  rust:
    kind: subprocess
    enabled: true
    language: Rust
    cmd: chess-cordis/drivers/rust/target/release/rustchess_driver.exe
    args: []
